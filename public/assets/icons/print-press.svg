<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Press base -->
  <rect x="8" y="32" width="32" height="8" rx="2" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
  
  <!-- Press arm -->
  <rect x="12" y="8" width="4" height="24" rx="2" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="32" y="8" width="4" height="24" rx="2" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
  
  <!-- Screen frame -->
  <rect x="16" y="12" width="16" height="12" rx="1" fill="none" stroke="#ff0080" stroke-width="2"/>
  
  <!-- Screen mesh -->
  <path d="M18 14L34 14M18 16L34 16M18 18L34 18M18 20L34 20M18 22L34 22" stroke="#ff0080" stroke-width="0.5" opacity="0.6"/>
  <path d="M20 14L20 22M22 14L22 22M24 14L24 22M26 14L26 22M28 14L28 22M30 14L30 22M32 14L32 22" stroke="#ff0080" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Squeegee -->
  <rect x="18" y="10" width="12" height="2" rx="1" fill="#00ffee"/>
  
  <!-- Print surface -->
  <rect x="14" y="28" width="20" height="4" rx="1" fill="#1a1a2e" stroke="#00ffee" stroke-width="1"/>
  
  <!-- Ink drops -->
  <circle cx="20" cy="26" r="1" fill="#ff0080"/>
  <circle cx="24" cy="25" r="1.5" fill="#00ffee"/>
  <circle cx="28" cy="26" r="1" fill="#8b5cf6"/>
  
  <!-- Neon accent lines -->
  <path d="M10 6L14 10M34 6L38 10" stroke="#ff0080" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 36L42 36" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Glow effect -->
  <defs>
    <filter id="pressGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#pressGlow)">
    <rect x="16" y="12" width="16" height="12" rx="1" fill="none" stroke="#ff0080" stroke-width="1" opacity="0.6"/>
    <rect x="18" y="10" width="12" height="2" rx="1" fill="none" stroke="#00ffee" stroke-width="1" opacity="0.8"/>
  </g>
</svg> 
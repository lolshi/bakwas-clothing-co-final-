<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Drop shape with crack -->
  <path d="M24 6C24 6 12 18 12 28C12 34.6274 17.3726 40 24 40C30.6274 40 36 34.6274 36 28C36 18 24 6 24 6Z" fill="#1a1a2e" stroke="#ff0080" stroke-width="2"/>
  
  <!-- Crack lines -->
  <path d="M20 16L28 24M24 12L24 20M18 22L26 30M22 28L30 36" stroke="#ff0080" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Broken chain links -->
  <ellipse cx="16" cy="12" rx="4" ry="6" fill="none" stroke="#ff0080" stroke-width="2" transform="rotate(-30 16 12)"/>
  <ellipse cx="32" cy="12" rx="4" ry="6" fill="none" stroke="#ff0080" stroke-width="2" transform="rotate(30 32 12)"/>
  
  <!-- Break in chain -->
  <path d="M18 8L22 12" stroke="#ff0080" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 12L30 8" stroke="#ff0080" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Shatter effect -->
  <path d="M20 20L16 16M28 20L32 16M24 24L20 28M24 24L28 28" stroke="#ff0080" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Limited edition marker -->
  <circle cx="38" cy="10" r="6" fill="#ff0080" opacity="0.8"/>
  <text x="38" y="14" text-anchor="middle" fill="white" font-size="8" font-weight="bold">1</text>
  
  <!-- Glow effect -->
  <defs>
    <filter id="dropGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#dropGlow)">
    <path d="M24 6C24 6 12 18 12 28C12 34.6274 17.3726 40 24 40C30.6274 40 36 34.6274 36 28C36 18 24 6 24 6Z" fill="none" stroke="#ff0080" stroke-width="1" opacity="0.6"/>
  </g>
</svg> 
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Spool body -->
  <rect x="16" y="12" width="16" height="24" rx="2" fill="#1a1a2e" stroke="#00ffee" stroke-width="2"/>
  
  <!-- Spool ends -->
  <ellipse cx="24" cy="12" rx="10" ry="4" fill="#1a1a2e" stroke="#00ffee" stroke-width="2"/>
  <ellipse cx="24" cy="36" rx="10" ry="4" fill="#1a1a2e" stroke="#00ffee" stroke-width="2"/>
  
  <!-- Thread wrapping -->
  <path d="M16 16C20 14 28 14 32 16" stroke="#00ffee" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M16 20C20 18 28 18 32 20" stroke="#00ffee" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M16 24C20 22 28 22 32 24" stroke="#00ffee" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M16 28C20 26 28 26 32 28" stroke="#00ffee" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M16 32C20 30 28 30 32 32" stroke="#00ffee" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Loose thread -->
  <path d="M32 20C36 18 40 16 42 12" stroke="#00ffee" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M38 14C40 12 42 10 44 8" stroke="#00ffee" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Thread end -->
  <circle cx="44" cy="8" r="2" fill="#00ffee"/>
  
  <!-- Quality marks -->
  <circle cx="20" cy="24" r="1" fill="#ff0080"/>
  <circle cx="24" cy="22" r="1" fill="#8b5cf6"/>
  <circle cx="28" cy="26" r="1" fill="#f97316"/>
  
  <!-- Glow effect -->
  <defs>
    <filter id="fabricGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#fabricGlow)">
    <rect x="16" y="12" width="16" height="24" rx="2" fill="none" stroke="#00ffee" stroke-width="1" opacity="0.6"/>
    <path d="M32 20C36 18 40 16 42 12" stroke="#00ffee" stroke-width="1" fill="none" opacity="0.8"/>
  </g>
</svg> 